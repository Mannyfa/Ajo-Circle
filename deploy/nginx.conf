server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Identity uploads: up to three files of 5 MB each (the API enforces the real limits).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, don't append: the API trusts this header only from this proxy, so a visitor can't inject an address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # CF-Connecting-IP (set by Cloudflare) passes through unchanged; see deploy/README.md.
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change, so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app; index.html must always be fresh so new deploys load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}

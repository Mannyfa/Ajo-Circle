# Local development only. Synthetic data only — never load real customer records here.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ajocircle
      POSTGRES_USER: ajocircle
      POSTGRES_PASSWORD: ${AJOCIRCLE_DB_PASSWORD:-ajocircle_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - ajocircle-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajocircle -d ajocircle"]
      interval: 5s
      retries: 10
  # Local test inbox: catches every email the app sends. Nothing leaves your machine.
  # Web UI: http://localhost:8025 · SMTP: localhost:1025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  ajocircle-pg:
